<script>
    $(document).ready(function() {
        var $owl = $("#owl-galery2");

        $owl.owlCarousel({
            items: 5,
            loop: true,
            margin: 10,
            nav: true,
            dots: true,
            navText: ["‹", "›"]
        });

        function updateMainImage() {
            let $firstActiveItem = $owl.find(".owl-item.active").first();
            let $img = $firstActiveItem.find("img");
            let $link = $firstActiveItem.find("a");

            let imgSrc = $img.attr("src");
            let imgAlt = $img.attr("alt");
            let linkHref = $link.attr("href");
            let caption = $link.data("caption");

            $("#mainImage").attr("src", imgSrc);
            $("#mainImage").attr("alt", imgAlt);
            $("#mainImageHref").attr("href", linkHref);
            $("#mainImageHref").attr("data-caption", caption);
        }

        $owl.on('changed.owl.carousel', function() {
            setTimeout(updateMainImage, 50);
        });

        // İlk yükleme sırasında başlat
        updateMainImage();
    });
</script>
